<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap" rel="stylesheet">
    <title>Join Our Newsletter</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        height: 100vh;
        font-family: Sora, sans-serif;
        font-optical-sizing: auto;
        font-style: normal;
      }
      hr {
        border: none;
        border-top: 1px solid lightgray;
        margin: 0;
      }
      #main {
        width: 600px;
        margin: 0 auto;
        padding-top: 5%;
        /* padding-left: 20%; */
        /* padding-right: 20%; */
      }
      .page {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        gap: 5rem;
      }
      .header {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 1rem;
      }
      .form {
        display: grid;
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 1fr 1fr;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        border-radius: 0.5rem;
        padding: 1rem;
        padding-bottom: 0;
        gap: 1rem;
      }
      .input {
        padding: 0.5rem;
        border: 1px solid lightgray;
        border-radius: 0.4rem;
        text-align: center;
      }
      .button {
        background-color: #284BCE;
        color: white;
        padding: 0.5rem;
        border: none;
        border-radius: 0.4rem;
        cursor: pointer;
      }
      .title {
        font-size: 3rem;
        font-weight: 600;
      }
      .subtext {
        color: gray;
        font-size: 1.25rem;
      }
      .helper-text {
        font-size: 0.8rem;
        color: #394150;
      }
    </style>
  </head>
  <body>
    <main id="main">
      <div class="page">
        <div class="header">
          <img src="/devchallenges/resources/logo-newsletter.svg" alt="Logo" width="50" height="50">
          <h1 class="title">Join our newsletter</h1>
          <p class="subtext">Keep up with our latest collections, exclusive deals, and special offers! We introduce a new collection every week, so stay tuned to snag the hottest items just for you.</p>
        </div>
        <form class="form">
          <input class="input" type="email" placeholder="Enter your email address" required>
          <input class="button" type="submit" value="Subscribe now">
          <p class="helper-text">Your email is 100% confidential and won't send you any spam.</p>
        </form>
      </div>
    </main>
  </body>
</html>
